[global]
   workgroup = WORKGROUP
   server string = ZeroUSB Network OS Deployment Server
   security = user
   map to guest = Bad User
   log file = /var/log/samba/network-installer.%m
   max log size = 1000
   dns proxy = no
   guest account = nobody
   client min protocol = SMB2
   server min protocol = SMB2

[windows]
   path = /home/mudhitha/System/Network-Installer/srv/samba/windows
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   force user = nobody
   create mask = 0755
   directory mask = 0755

[bodhi]
   path = /home/mudhitha/System/Network-Installer/srv/samba/bodhi
   browseable = yes
   read only = yes
   guest ok = yes
   guest only = yes
   force user = nobody
   create mask = 0755
   directory mask = 0755

