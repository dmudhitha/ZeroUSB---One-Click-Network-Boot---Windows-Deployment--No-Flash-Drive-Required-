# ==============================================================================
# ZeroUSB - Dnsmasq ProxyDHCP & TFTP Configuration (Universal Intel PXE ROM)
# ==============================================================================

# Disable DNS functionality (PXE boot only)
port=0
log-dhcp

# Network interface to listen on
interface=enp3s0

# Enable ProxyDHCP on the host interface IP (co-exists with router DHCP)
dhcp-range=192.168.1.41,proxy

# Built-in TFTP Server
enable-tftp
tftp-root=/home/mudhitha/System/Network-Installer/srv/tftp

# Client Architecture Detection (RFC 4578)
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi-x86,option:client-arch,6
dhcp-match=set:efi-x64,option:client-arch,7
dhcp-match=set:efi-x64,option:client-arch,9
dhcp-match=set:efi-arm64,option:client-arch,11

# Match iPXE via Option 175 and User-Class (Universal iPXE Chaining)
dhcp-match=set:ipxe,175
dhcp-userclass=set:ipxe,iPXE

# Explicit DHCP Options 66 (TFTP Server) and 67 (Boot filename) for Intel Option ROMs
dhcp-option=66,192.168.1.41

# If client is ALREADY running iPXE, deliver the HTTP menu script
dhcp-option=tag:ipxe,67,http://192.168.1.41:8080/boot.ipxe

# If client is initial PXE ROM (!ipxe), deliver the TFTP bootloader binary
dhcp-option=tag:!ipxe,tag:bios,67,undionly.kpxe
dhcp-option=tag:!ipxe,tag:efi-x64,67,ipxe.efi
dhcp-option=tag:!ipxe,tag:efi-x86,67,ipxe32.efi
dhcp-option=tag:!ipxe,tag:efi-arm64,67,ipxe-arm64.efi

# PXE Service & Prompt Definitions (REQUIRED for Intel PXE ROM port 4011 ProxyDHCP)
pxe-prompt="ZeroUSB Network Boot", 0
pxe-service=x86PC,"ZeroUSB BIOS Bootloader",undionly.kpxe
pxe-service=PC98,"ZeroUSB PC98",undionly.kpxe
pxe-service=IA64_EFI,"ZeroUSB IA64",ipxe.efi
pxe-service=Alpha,"ZeroUSB Alpha",undionly.kpxe
pxe-service=Arc_x86,"ZeroUSB Arc",undionly.kpxe
pxe-service=Intel_Lean_Client,"ZeroUSB Lean",undionly.kpxe
pxe-service=IA32_EFI,"ZeroUSB UEFI 32",ipxe32.efi
pxe-service=BC_EFI,"ZeroUSB UEFI 64 (BC)",ipxe.efi
pxe-service=Xscale_EFI,"ZeroUSB Xscale",ipxe.efi
pxe-service=X86-64_EFI,"ZeroUSB UEFI 64",ipxe.efi
pxe-service=ARM64_EFI,"ZeroUSB ARM64",ipxe-arm64.efi

# Boot file mapping:
# 1. If client is running iPXE, load boot.ipxe directly over HTTP
dhcp-boot=tag:ipxe,http://192.168.1.41:8080/boot.ipxe

# 2. If client is initial UEFI/BIOS PXE, deliver the appropriate iPXE binary via TFTP
dhcp-boot=tag:!ipxe,tag:bios,undionly.kpxe,192.168.1.41,192.168.1.41
dhcp-boot=tag:!ipxe,tag:efi-x64,ipxe.efi,192.168.1.41,192.168.1.41
dhcp-boot=tag:!ipxe,tag:efi-x86,ipxe32.efi,192.168.1.41,192.168.1.41
dhcp-boot=tag:!ipxe,tag:efi-arm64,ipxe-arm64.efi,192.168.1.41,192.168.1.41

# 3. Fallback defaults for Intel PXE ROMs
dhcp-boot=tag:bios,undionly.kpxe,192.168.1.41,192.168.1.41
dhcp-boot=tag:efi-x64,ipxe.efi,192.168.1.41,192.168.1.41
dhcp-boot=undionly.kpxe,192.168.1.41,192.168.1.41
