set default="0"
set timeout=15

# Native input drivers for all USB and PS/2 keyboards
insmod keylayouts
insmod at_keyboard
insmod usb
insmod uhci
insmod ohci
insmod ehci
insmod usb_keyboard
terminal_input --append at_keyboard
terminal_input --append usb_keyboard
terminal_input --append console

insmod all_video
insmod font
if loadfont (tftp)/boot/grub/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# ==================== Hiren's BootCD PE (Modern Win10 PE) (Requires 6GB+ RAM) ====================
menuentry "Hiren's BootCD PE (Modern Win10 PE) (Requires 6GB+ RAM)" --id hbcd_pe {
    echo "Loading Windows Bootloader..."
    insmod chain
    chainloader /boot/hbcd_pe/bootmgr.efi
}

# ==================== Windows 10 (64-bit) ====================
menuentry "Windows 10 (64-bit)" --id win10 {
    echo "Loading Windows Bootloader..."
    insmod chain
    chainloader /boot/win10/bootmgr.efi
}

menuentry "Boot from first hard drive" {
    set root=(hd0)
    chainloader +1
}

menuentry "Reboot Computer" {
    reboot
}

menuentry "Power Off" {
    halt
}
